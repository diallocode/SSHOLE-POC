services:
  sshd:
    build:
      context: .
      args:
        ALPINE_VERSION: "3.19"
        OPENSSH_VERSION: "9.6p1"
    image: ssh-lab:9.6p1
    restart: unless-stopped
    volumes:
      - ./config/sshd_config:/etc/ssh/sshd_config:ro
    networks:
      - lab

networks:
  lab:
    internal: true