---
- name: Preparer la VM Debian
  hosts: all
  become: true

  tasks:
    - name: Installer les certificats CA
      ansible.builtin.apt:
        name: ca-certificates
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Créer le répertoire des clés APT
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Télécharger la clé officielle Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configurer le dépôt Docker pour Debian 12
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/debian bookworm stable
        filename: docker
        state: present
        update_cache: true

    - name: Installer Docker, Compose et le client SSH
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
          - openssh-client
        state: present

    - name: Activer et demarrer Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Ajouter l'utilisateur Vagrant au groupe Docker
      ansible.builtin.user:
        name: vagrant
        groups: docker
        append: true

    - name: Construction et demarrage du conteneur sshd
      ansible.builtin.command:
        cmd: docker compose up -d --build sshd
        chdir: /vagrant/docker
      changed_when: true